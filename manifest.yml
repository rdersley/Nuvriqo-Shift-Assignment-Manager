modules:
  jira:adminPage:
    - key: nuvriqo-shift-assignment-manager-admin
      resource: admin-ui
      resolver:
        function: resolver
      render: native
      title: Shift & Assignment Manager
      layout: native
    - key: nuvriqo-shift-assignment-routing-safety
      resource: routing-settings-ui
      resolver:
        function: routing-settings-resolver
      render: native
      title: Shift Manager Routing Safety
      layout: native
  jira:projectPage:
    - key: nuvriqo-shift-schedule-project-page
      resource: schedule-ui
      resolver:
        function: schedule-resolver
      render: native
      title: Shift Schedule
      layout: native
  trigger:
    - key: jira-assignment-events
      function: jira-event-handler
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
        - avi:jira:assigned:issue
        - avi:jira:commented:issue
      filter:
        ignoreSelf: true
  scheduledTrigger:
    - key: scheduled-assignment-evaluation
      function: scheduled-handler
      interval: fiveMinute
  function:
    - key: resolver
      handler: index.handler
    - key: schedule-resolver
      handler: schedule.handler
    - key: routing-settings-resolver
      handler: routingSettings.handler
    - key: jira-event-handler
      handler: background.jiraEventHandler
    - key: scheduled-handler
      handler: background.scheduledHandler
      timeoutSeconds: 300
resources:
  - key: admin-ui
    path: src/frontend/admin.jsx
  - key: schedule-ui
    path: src/frontend/schedule.jsx
  - key: routing-settings-ui
    path: src/frontend/routingSettings.jsx
permissions:
  scopes:
    - storage:app
    - read:user:jira
    - read:jira-work
    - write:jira-work
    - read:servicedesk-request
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/d2507c10-c579-4b21-9ba1-b9da631ee3c5
