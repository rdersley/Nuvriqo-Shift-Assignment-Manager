modules:
  jira:adminPage:
    - key: nuvriqo-shift-assignment-manager-admin
      resource: admin-ui
      resolver:
        function: resolver
      render: native
      title: Shift & Assignment Manager
      layout: native
  trigger:
    - key: jira-assignment-events
      function: jira-event-handler
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
        - avi:jira:assigned:issue
        - avi:jira:commented:issue
      filter:
        ignoreSelf: true
  scheduledTrigger:
    - key: scheduled-assignment-evaluation
      function: scheduled-handler
      interval: fiveMinute
  function:
    - key: resolver
      handler: index.handler
    - key: jira-event-handler
      handler: index.jiraEventHandler
    - key: scheduled-handler
      handler: index.scheduledHandler
      timeoutSeconds: 300
resources:
  - key: admin-ui
    path: src/frontend/index.jsx
permissions:
  scopes:
    - storage:app
    - read:user:jira
    - read:jira-work
    - write:jira-work
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/d2507c10-c579-4b21-9ba1-b9da631ee3c5
