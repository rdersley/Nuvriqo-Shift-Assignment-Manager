modules:
  jira:adminPage:
    - key: nuvriqo-shift-assignment-manager-admin
      resource: admin-ui
      resolver:
        function: resolver
      render: native
      title: Shift & Assignment Manager
      layout: native
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: admin-ui
    path: src/frontend/index.jsx
permissions:
  scopes:
    - storage:app
    - read:user:jira
    - read:jira-work
    - write:jira-work
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/d2507c10-c579-4b21-9ba1-b9da631ee3c5
